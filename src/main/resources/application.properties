quarkus.http.port=8080
quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.jackson.fail-on-unknown-properties=false
smallrye.jwt.new-token.issuer=${AUTH_JWT_ISSUER:workshop-auth}
smallrye.jwt.new-token.audience=${AUTH_JWT_AUDIENCE:workshop-requirements-api}
smallrye.jwt.new-token.lifespan=3600
%dev.smallrye.jwt.sign.key.location=${AUTH_JWT_PRIVATE_KEY_PATH}
%prod.smallrye.jwt.sign.key.location=${AUTH_JWT_PRIVATE_KEY_PATH}
